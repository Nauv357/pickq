<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拾题 · 自建题库</title>
    <script>
      /* 主题防闪(优先于 CSS 执行):读 localStorage 'tiku:theme'(system|light|dark),
         否则跟随系统 prefers-color-scheme;决定是否给 <html> 加 dark 类 */
      (function () {
        try {
          var p = localStorage.getItem('tiku:theme') || 'system'
          var dark = p === 'dark' || (p === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', !!dark)
        } catch (e) { /* 静默 */ }
      })()
    </script>
    <style>
      /* 首屏底色跟随主题变量,避免闪白/闪黑(实际背景色由 main.css token 控制) */
      html { background: #efece2; }
      html.dark { background: #17181b; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
