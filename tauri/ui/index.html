<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>拾题</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #efece2; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  .wrap { text-align: center; color: #6b675e; }
  .seal { display: inline-flex; align-items: center; justify-content: center;
          width: 64px; height: 64px; border-radius: 14px; background: #c3272b;
          color: #fff; font-size: 30px; font-weight: 700; margin-bottom: 18px; }
  p { font-size: 14px; margin: 0 0 16px; }
  .spin { width: 22px; height: 22px; border: 2.5px solid rgba(26,26,24,.15);
          border-top-color: #1a1a18; border-radius: 50%; margin: 0 auto;
          animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="seal">拾</div>
    <p>正在启动拾题…</p>
    <div class="spin"></div>
  </div>
</body>
</html>
